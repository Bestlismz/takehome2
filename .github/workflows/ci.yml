name: Luklaan checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luklaan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: luklaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luklaan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      LUKLAAN_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/luklaan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Test browser logic and SDK contracts
        run: node --test app/tests/*.test.mjs
      - name: Test API and PostgreSQL persistence
        run: python -m unittest discover -s app/tests -p 'test_*.py'
      - name: Build Luklaan image
        run: docker build --tag luklaan:${{ github.sha }} .
      - name: Start image against the test database
        run: >-
          docker run --detach --name luklaan-ci --network host
          --env LUKLAAN_DATABASE_URL
          luklaan:${{ github.sha }}
      - name: Verify image serves the app and loads a workspace
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          origin = 'http://localhost:5173'
          deadline = time.monotonic() + 30
          while True:
              try:
                  with urllib.request.urlopen(origin + '/api/health', timeout=3) as response:
                      assert json.load(response)['ok'] is True
                  break
              except (urllib.error.URLError, TimeoutError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.5)

          with urllib.request.urlopen(origin, timeout=5) as response:
              assert b'./app.js' in response.read()
          request = urllib.request.Request(
              origin + '/api/workspace',
              data=b'{"operation":"load"}',
              headers={'Content-Type': 'application/json', 'Origin': origin},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.load(response)
              assert result['revision'] == 0
              assert result['state']['events'] == []
          print('Image serves Luklaan and reads PostgreSQL without an OpenAI key.')
          PY
      - name: Container diagnostics
        if: failure()
        run: docker logs luklaan-ci || true
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force luklaan-ci || true
