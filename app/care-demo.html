<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลูกหลาน · ตัวอย่างการดูแล</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="art.css"><link rel="stylesheet" href="family-experience.css"><style>body{margin:0}main{max-width:1180px;margin:auto;padding:24px}.demo-label{padding:14px 24px;background:#f1dfbd;color:#55462c;font-size:14px;line-height:1.7;position:sticky;top:0;z-index:10}.demo-label a{color:#3855a6;float:right}.demo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#334b83;color:white;padding:14px 24px;border-radius:16px;z-index:20}button:disabled{opacity:.5;cursor:default}</style>
<div class="demo-label">ตัวอย่างข้อมูลสมมติ · สำหรับดู UX เท่านั้น ไม่บันทึกลงฐานข้อมูล <a href="/#care">กลับแอป ↗</a></div><main id="demo"></main><div id="demo-status" role="status"></div>
<script type="module">
import {familyDashboardMarkup} from './family-experience.js';
const now=new Date().toISOString();
const state={events:[{id:'example-glucose',kind:'glucose',confirmed:true,source:'manual',occurredAt:now,payload:{value:65,unit:'mg/dL',measured:true,mealRelation:'before_meal'}},{id:'example-adherence',kind:'adherence',confirmed:true,source:'speech',occurredAt:now,payload:{status:'missed',text:'เล่าว่าลืมยามื้อเช้า'}},{id:'example-bp',kind:'bloodPressure',confirmed:true,source:'manual',occurredAt:now,payload:{systolic:128,diastolic:78}}],profile:{},sharing:{},activities:{}};
const workspace={alerts:[{id:'example-alert',severity:'attention',title:'น้ำตาลที่วัด 65 mg/dL',action:'ตรวจสอบอาการและทำตามแผนรับมือน้ำตาลต่ำที่แพทย์ให้ ติดต่อทีมรักษา หากหมดสติ ชัก หรือกลืนไม่ได้ ให้โทร 1669 อย่าป้อนอาหารหรือน้ำ',evidenceId:'example-glucose',occurredAt:now,historical:false}]};
function render(){document.querySelector('#demo').innerHTML=familyDashboardMarkup(state,workspace);for(const b of document.querySelectorAll('[data-action]'))if(b.dataset.action!=='alert-acknowledge')b.disabled=true;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="alert-acknowledge"]');if(!b)return;workspace.alerts[0].acknowledgedAt=new Date().toISOString();render();const host=document.querySelector('#demo-status');host.className='demo-toast';host.textContent='ตัวอย่าง: รับทราบแล้ว ยังไม่ถือว่าปัญหาจบ';setTimeout(()=>{host.textContent='';host.className='';},3000);});render();
</script></html>
