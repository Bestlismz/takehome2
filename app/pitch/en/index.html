<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luklarn · Investor presentation</title>
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../pitch.css">
<style>html[lang="en"] .copy h1{font-size:clamp(38px,4.1vw,66px);line-height:1.17;letter-spacing:-1.5px}
html[lang="en"] .copy:has(.stack) h1{font-size:clamp(36px,3.5vw,55px)}
html[lang="en"] .showcase:after{content:'A conversation. A little care.'}
html[lang="en"] .phone h2{font-size:23px;line-height:1.3}
html[lang="en"] .phone-header{font-size:16px}
html[lang="en"] .editorial .stat{font-size:clamp(85px,10vw,150px);letter-spacing:-5px}
html[lang="en"] .feature{grid-template-columns:48px 1fr}
html[lang="en"] .business span{font-size:21px}
@media(max-height:820px) and (min-width:901px){html[lang="en"] .copy:has(.stack) h1{font-size:38px}html[lang="en"] .phone h2{font-size:20px}html[lang="en"] .copy .lead{font-size:17px}}
@media(max-width:900px){html[lang="en"] .copy h1{font-size:38px}html[lang="en"] .copy:has(.stack) h1{font-size:36px}html[lang="en"] .lead{font-size:16px}}
</style>
</head>
<body>
  <header class="masthead"><a class="wordmark" href="#1"><img src="../../assets/luklaan-mascot.png" alt="">Luklarn<span>Investor presentation</span></a><div class="header-actions"><span class="demo-label">Demo data</span><button id="notesToggle" aria-label="Speaker notes" title="Speaker notes (N)"></button><button id="fullscreen" aria-label="Fullscreen" title="Fullscreen (F)"></button></div></header>
  <main id="stage" aria-live="polite"></main>
  <aside id="notes" hidden></aside>
  <footer class="deck-controls"><div class="chapter" id="chapter"></div><nav id="dots" aria-label="Choose a slide"></nav><div class="paging"><button id="prev" aria-label="Previous slide"></button><span id="counter"></span><button id="next" aria-label="Next slide"></button></div></footer>
  <div class="progress"><div id="progress"></div></div>
  <script type="module" src="pitch-en.js"></script>
</body>
</html>
