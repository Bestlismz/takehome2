apiVersion: v1
kind: deployment
metadata:
  name: agent-api
  environment: production

spec:
  replicas: 2
  
  container:
    name: agent-api
    # TODO: This should be updated by the CD pipeline
    image_tag: "9a3b00935fbcc796a28beb310a2e48caf5470501"
    port: 8080
    
    env:
      - name: PROMPT_VERSION
        value: "v1.0.0"
    
    resources:
      cpu: "500m"
      memory: "512Mi"
    
    healthcheck:
      path: /healthz
      interval: 10s
      timeout: 5s

