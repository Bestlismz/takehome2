name: luklaan

services:
  app:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      LUKLAAN_DATABASE_URL: "host=postgres dbname=luklaan_dev user=luklaan"
      PGPASSWORD: ${LUKLAAN_DB_PASSWORD:-luklaan-local}
      LUKLAAN_ALLOWED_ORIGINS: "http://localhost:${LUKLAAN_PORT:-5173},http://127.0.0.1:${LUKLAAN_PORT:-5173},${LUKLAAN_ALLOWED_ORIGINS:-}"
    ports:
      - "127.0.0.1:${LUKLAAN_PORT:-5173}:5173"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: luklaan
      POSTGRES_PASSWORD: ${LUKLAAN_DB_PASSWORD:-luklaan-local}
      POSTGRES_DB: luklaan_dev
    volumes:
      - luklaan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luklaan -d luklaan_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  luklaan-data:
